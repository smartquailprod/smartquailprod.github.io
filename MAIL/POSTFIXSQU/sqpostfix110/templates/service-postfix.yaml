apiVersion: v1
kind: Service
metadata:
  name: postfix-service
  namespace: mail-srv  # Namespace correspondiente para los servicios de correo
  labels:
    app: postfix
spec:
  type: NodePort
  selector:
    app: postfix
  ports:
    - name: smtp
      protocol: TCP
      port: 25
      targetPort: 25
      nodePort: 25  # Puerto forzado en el nodo (requiere el parámetro --service-node-port-range en K3s)
    - name: smtps
      protocol: TCP
      port: 465
      targetPort: 465
      nodePort: 465  # Puerto forzado en el nodo
    - name: submission
      protocol: TCP
      port: 587
      targetPort: 587
      nodePort: 587  # Puerto forzado en el nodo