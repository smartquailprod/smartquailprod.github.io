apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.db_host }}
  namespace: {{ .Values.NameSpaceCluster }}   # <-- Corregido (NameSpaceCluster con S mayúscula o como esté en tus values)
  labels:
    app: {{ .Values.db_host }}
spec:
  type: {{ .Values.dbservicetype }}
  externalName: {{ .Values.dbExternalName }}
  ports:
  - port: 5432
    protocol: TCP