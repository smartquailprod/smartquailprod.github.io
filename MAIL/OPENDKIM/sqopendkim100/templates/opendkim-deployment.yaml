apiVersion: apps/v1
kind: Deployment
metadata:
  name: opendkim
  labels:
    app: opendkim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opendkim
  template:
    metadata:
      labels:
        app: opendkim
    spec:
      initContainers:
      - name: init-opendkim-permissions
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /etc/opendkim/keys/smartquail.io
            chown -R 90:91 /etc/opendkim/keys
            chmod 700 /etc/opendkim/keys
            chmod 700 /etc/opendkim/keys/smartquail.io
            if [ -f /etc/opendkim/keys/smartquail.io/default.private ]; then
              chmod 600 /etc/opendkim/keys/smartquail.io/default.private
            fi
        volumeMounts:
        - name: opendkim-keys # Usa el nombre real de tu volumen montado
          mountPath: /etc/opendkim/keys

      containers:
      - name: opendkim
        image: smartquail/qndopendkim100:latest
        ports:
        - containerPort: 8891
          name: milter
        volumeMounts:
        - name: opendkim-keys
          mountPath: /etc/opendkim/keys  # Montamos el PVC aquí
      volumes:
      - name: opendkim-keys
        persistentVolumeClaim:
          claimName: opendkim-keys-pvc  # Usamos el PVC aquí
