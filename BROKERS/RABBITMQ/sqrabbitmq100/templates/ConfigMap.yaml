apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: brk-srv
data:
  rabbitmq.conf: |
    ## Configuración de los logs ##
    log.dir = /var/log/rabbitmq
    log.file = rabbit@rabbitmq.log
    log.console.level = info

    ## Configuración del plugin de management (puerto de UI) ##
    management.listener.port = 15672

    ## Configuración de las colas ##
    queue_master_locator = min-masters

    ## --- SALVAGUARDAS DE MEMORIA Y RECURSOS --- ##
    
    # 1. High Watermark de Memoria (Ej: Pausar productores si RabbitMQ supera el 70% de la RAM asignada al contenedor)
    vm_memory_high_watermark.relative = 0.7

    # 2. Límite de espacio en disco para evitar que colapse el almacenamiento persistente
    disk_free_limit.absolute = 2GB

    # 3. Control de conexiones masivas (Heartbeats para detectar clientes muertos y liberar sockets)
    heartbeat = 60

    ## Otras configuraciones útiles ##
    listeners.tcp.default = 5672
    listeners.ssl.default = 5671
    default_vhost = /
    default_user = ${RABBITMQ_DEFAULT_USER}
    default_pass = ${RABBITMQ_DEFAULT_PASS}