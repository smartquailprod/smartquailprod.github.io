apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-ingress
  namespace: db-srv 
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pgadmin.smartquail.io 
      secretName: pgadmin-smartquail-io-tls  # <--- Cambiado al nombre correcto del Secret
  rules:
    - host: pgadmin.smartquail.io 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin-service
                port:
                  number: 80