# Default values for qnd100.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
qnodename: qnd041app
qnodenamespace: www-apps
ingress_name: qnd041-app-ingress
domainname: ec
nodeRole: app


image:
  repository: smartquail/qnd041app
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"


resources: 
   limits:
     cpu: 700m
     memory: 300Mi
   requests:
     cpu: 100m
     memory: 256Mi

