apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.domainName }}-smartquail-io-tls
  namespace: www-apps
spec:
  secretName: {{ .Values.domainName }}-smartquail-io-tls
  duration: 2160h
  renewBefore: 360h
  isCA: false
  commonName: smartquail.io
  dnsNames:
    - smartquail.io
    - {{ .Values.domainName }}.smartquail.io
  issuerRef:
    name: letsencrypt-cluster-issuer
    kind: ClusterIssuer