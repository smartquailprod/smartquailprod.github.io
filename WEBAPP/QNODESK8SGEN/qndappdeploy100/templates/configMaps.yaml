apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config-{{ .Values.qnodename }}
  namespace: {{ .Values.qnodenamespace }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush              5
        Daemon             Off
        Log_Level          info
        Parsers_File       parsers.conf

    [INPUT]
        Name               tail
        Path               /var/log/{{ .Values.qnodename }}/{{ .Values.qnodename }}.log
        Tag                app.{{ .Values.qnodename }}
        DB                 /tmp/{{ .Values.qnodename }}.db
        Parser             {{ .Values.qnodename }}
        Refresh_Interval   5
        Mem_Buf_Limit      50MB

    [OUTPUT]
        Name               es
        Match              app.{{ .Values.qnodename }}
        Host               elasticsearch
        Port               9200
        Index              {{ .Values.qnodename }}-logs
        Time_Key           @timestamp
        Replace_Dots       On
        Retry_Limit        False
        HTTP_User          ${FLUENT_ELASTICSEARCH_USER}
        HTTP_Passwd        ${FLUENT_ELASTICSEARCH_PASSWORD}
        Suppress_Type_Name On

    [OUTPUT]
        Name               es
        Match              app.uwsgi
        Host               elasticsearch
        Port               9200
        Index              uwsgi-logs
        Time_Key           @timestamp
        Replace_Dots       On
        Retry_Limit        False
        HTTP_User          ${FLUENT_ELASTICSEARCH_USER}
        HTTP_Passwd        ${FLUENT_ELASTICSEARCH_PASSWORD}
        Suppress_Type_Name On

  parsers.conf: |
    [PARSER]
        Name             {{ .Values.qnodename }}
        Format           json
        Time_Key         time
        Time_Format      %Y-%m-%dT%H:%M:%S.%f
        Time_Keep        On

    [PARSER]
        Name             uwsgi
        Format           regex
        Regex            ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?<level>[A-Z]+) (?<message>.*)
        Time_Key         time
        Time_Format      %Y-%m-%d %H:%M:%S
        Time_Keep        On