apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qnd041-app-ingress
  namespace: {{ .Values.qnodenamespace }}
  annotations:
    # --- ANOTACIONES DE TAMAÑO Y TIMEOUT PARA NGINX-STABLE (F5) ---
    nginx.org/client-max-body-size: "0"         # "0" = Sin límite (o "1024m" para 1GB)
    nginx.org/proxy-connect-timeout: "600s"
    nginx.org/proxy-read-timeout: "600s"
    nginx.org/proxy-send-timeout: "600s"
    cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer    
    nginx.org/location-snippets: |
      more_set_headers 'Access-Control-Allow-Origin' '*';
      more_set_headers 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      more_set_headers 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
      more_set_headers 'Access-Control-Max-Age' 1728000;
      more_set_headers 'Content-Type' 'text/plain; charset=utf-8';
      more_set_headers 'Content-Length' 0;
spec:
  ingressClassName: nginx
  rules:
    - host: ec.smartquail.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.qnodename }}
                port:
                  number: 80
  tls:
    - secretName: {{ .Values.secret_name }}
      hosts:
        -  ec.smartquail.io
