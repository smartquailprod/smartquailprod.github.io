apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.qnodename }}
  namespace: {{ .Values.qnodenamespace }}
  labels:
    app: {{ .Values.qnodename }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.qnodename }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app: {{ .Values.qnodename }}
    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: {{ .Values.qnodename }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          
          # Mantiene el contenedor principal vivo pasivamente para inspección o pruebas manuales
          command: ["/bin/bash", "-c", "echo 'Contenedor en espera pasiva'; sleep infinity"]

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
              
          env:
            - name: HOME
              value: "/tmp"
            - name: PROJECT_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: PROJECT_NAME
            - name: APP_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: APP_NAME
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: GH_TOKEN
            - name: DOCKER_HUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: DOCKER_HUB_USERNAME
            - name: DOCKER_HUB_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: DOCKER_HUB_ACCESS_TOKEN
            - name: GIT_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: GIT_USER_NAME
            - name: GIT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: GIT_USER_EMAIL
            - name: GH_ORG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: GH_ORG
            - name: REPO_VISIBILITY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qnodename }}-secrets
                  key: REPO_VISIBILITY

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.qnodename }}-autodeploy-job
  namespace: {{ .Values.qnodenamespace }}
spec:
  # Programación opcional (ej: diariamente a medianoche, o disparado por tu agente a demanda)
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 1000
          restartPolicy: OnFailure
          containers:
            - name: autodeploy-runner
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: "{{ .Values.image.pullPolicy }}"
              
              # Lógica de ejecución autónoma del pipeline de despliegue
              command: ["/bin/bash", "-c"]
              args:
                - |
                  echo "=== Iniciando pipeline autónomo de autogeneración y despliegue ==="
                  
                  # Ubicación robusta dentro del workspace o recursos del contenedor
                  TARGET_DIR="/workdir/resources"
                  if [ ! -d "$TARGET_DIR" ]; then
                    TARGET_DIR="/resources"
                  fi
                  cd "$TARGET_DIR" || cd .
                  
                  if [ -f "./deploy.sh" ]; then
                    chmod +x ./deploy.sh
                    ./deploy.sh
                  elif [ -f "/workdir/resources/deploy.sh" ]; then
                    chmod +x /workdir/resources/deploy.sh
                    /workdir/resources/deploy.sh
                  else
                    echo "ERROR: deploy.sh no encontrado"
                    exit 1
                  fi
                  
                  echo "=== Pipeline finalizado con éxito: Imagen subida a Docker Hub ==="

              securityContext:
                runAsUser: 1000
                runAsGroup: 1000

              env:
                - name: HOME
                  value: "/tmp"
                - name: PROJECT_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: PROJECT_NAME
                - name: APP_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: APP_NAME
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: GH_TOKEN
                - name: DOCKER_HUB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: DOCKER_HUB_USERNAME
                - name: DOCKER_HUB_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: DOCKER_HUB_ACCESS_TOKEN
                - name: GIT_USER_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: GIT_USER_NAME
                - name: GIT_USER_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: GIT_USER_EMAIL
                - name: GH_ORG
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: GH_ORG
                - name: REPO_VISIBILITY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.qnodename }}-secrets
                      key: REPO_VISIBILITY