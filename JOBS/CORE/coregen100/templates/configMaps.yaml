apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.qnodename }}-script-config
  namespace: {{ .Values.qnodenamespace }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    
    # Como el código se copió en la raíz '/' debido a que PROJECT_NAME estaba vacío
    echo "Ejecutando desde la raíz del contenedor"
    cd /
    
    if [ ! -f "./deploy.sh" ]; then
      echo "ERROR: No se encuentra el archivo deploy.sh en /"
      exit 1
    fi

    exec ./deploy.sh