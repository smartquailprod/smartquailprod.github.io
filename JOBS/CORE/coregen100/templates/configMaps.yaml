apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.qnodename }}-script-config
  namespace: {{ .Values.qnodenamespace }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    
    export PATH="/root/.cargo/bin:/usr/local/bin:$PATH"
    
    echo "Ejecutando desde la raíz del contenedor"
    cd /
    
    # Verificamos la ruta donde está deploy.sh (puede estar en la raíz o en recursos)
    DEPLOY_SCRIPT="./deploy.sh"
    if [ ! -f "$DEPLOY_SCRIPT" ]; then
      DEPLOY_SCRIPT="/resources/deploy.sh"
    fi

    if [ ! -f "$DEPLOY_SCRIPT" ]; then
      echo "ERROR: No se encuentra el archivo deploy.sh"
      exit 1
    fi

    echo "Dando permisos de ejecución a $DEPLOY_SCRIPT"
    chmod +x "$DEPLOY_SCRIPT"

    echo "Iniciando despliegue..."
    exec "$DEPLOY_SCRIPT"