apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.qnodename }}-script-config
  namespace: {{ .Values.qnodenamespace }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    
    # Ruta fija correcta basada en tu Dockerfile
    PROJECT_DIR="/qnd15000app"

    echo "Cambiando al directorio de trabajo: $PROJECT_DIR"
    cd "$PROJECT_DIR"
    
    # Verificamos que el script exista antes de ejecutarlo
    if [ ! -f "./deploy.sh" ]; then
      echo "ERROR: No se encuentra el archivo deploy.sh en $PROJECT_DIR"
      exit 1
    fi

    exec ./deploy.sh