apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.qnodename }}-script-config
  namespace: {{ .Values.qnodenamespace }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    
    # Aseguramos que la ruta de uv esté disponible para la ejecución
    export PATH="/root/.cargo/bin:$PATH"
    
    echo "Ejecutando desde la raíz del contenedor"
    cd /
    
    if [ ! -f "./deploy.sh" ]; then
      echo "ERROR: No se encuentra el archivo deploy.sh en /"
      exit 1
    fi

    exec ./deploy.sh