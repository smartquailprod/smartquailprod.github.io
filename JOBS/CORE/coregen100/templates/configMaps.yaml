apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.qnodename }}-script-config
  namespace: {{ .Values.qnodenamespace }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e

    echo "=========================================="
    echo " ¡Despliegue Iniciado con éxito!"
    echo " PROJECT_NAME: ${PROJECT_NAME}"
    echo "=========================================="

    export PATH="/root/.cargo/bin:/usr/local/bin:$PATH"
    
    # Nos movemos a la carpeta resources del proyecto donde están todos los archivos
    TARGET_DIR="/${PROJECT_NAME}/resources"
    if [ ! -d "$TARGET_DIR" ]; then
      TARGET_DIR="/workdir/resources"
    fi

    cd "$TARGET_DIR" || { echo "ERROR: No se pudo cambiar al directorio $TARGET_DIR"; exit 1; }
    echo "Ejecutando desde: $(pwd)"

    DEPLOY_SCRIPT="./deploy.sh"
    if [ ! -f "$DEPLOY_SCRIPT" ]; then
      echo "ERROR: No se encuentra el archivo deploy.sh en $(pwd)"
      exit 1
    fi

    echo "Dando permisos de ejecución a $DEPLOY_SCRIPT"
    chmod +x "$DEPLOY_SCRIPT"

    echo "Iniciando despliegue..."
    "$DEPLOY_SCRIPT"

    echo "=========================================="
    echo " ¡Proceso completado para el proyecto!"
    echo " PROJECT_NAME: ${PROJECT_NAME}"
    echo "=========================================="