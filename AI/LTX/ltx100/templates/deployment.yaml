apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ltx.fullname" . }}
  namespace: ai-models
  labels:
    {{- include "ltx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: ltx-video
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          # Inyecta automáticamente todas las variables definidas en ltx-secrets (HF_TOKEN, LTX_PRECISION, etc.)
          envFrom:
            - secretRef:
                name: ltx-secrets
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
              {{- if .Values.resources.limits.gpu }}
              nvidia.com/gpu: {{ .Values.resources.limits.gpu | quote }}
              {{- end }}
          volumeMounts:
            - mountPath: /root/ComfyUI/models
              name: ltx-models-storage
      volumes:
        - name: ltx-models-storage
          persistentVolumeClaim:
            claimName: {{ include "ltx.fullname" . }}-pvc