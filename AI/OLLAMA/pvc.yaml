  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: ollama-pvc
    namespace: ai-models
  spec:
    capacity:
      storage: 10Gi
    accessModes:
      - ReadWriteOnce
    persistentVolumeReclaimPolicy: Retain
    storageClassName: local-storage
    hostPath:
      path: /var/lib/ollama
      type: DirectoryOrCreate