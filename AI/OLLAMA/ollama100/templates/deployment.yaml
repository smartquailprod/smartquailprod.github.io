apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ollama.fullname" . }}
  namespace: ai-models
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # =========================================================================
      # INIT CONTAINER: Descarga segura al PV si el modelo no existe
      # =========================================================================
      initContainers:
        - name: ollama-model-puller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              MODEL_NAME="${OLLAMA_MODEL:-qwen2.5:0.5b}"
              echo "Iniciando servidor temporal para verificar el modelo '${MODEL_NAME}' en el PV..."
              
              # Arrancamos ollama en segundo plano apuntando al PV montado
              ollama serve &
              SERVER_PID=$!
              
              # Esperamos a que la API esté lista (máximo 30 segundos)
              counter=0
              until ollama list > /dev/null 2>&1; do
                sleep 2
                counter=$((counter+1))
                if [ $counter -gt 15 ]; then
                  echo "Error: El servidor temporal de Ollama no respondió a tiempo."
                  exit 1
                fi
              done
              
              # Verificamos si el modelo ya se encuentra en el volumen
              if ollama list | grep -qE "${MODEL_NAME%%:*}"; then
                echo "El modelo '${MODEL_NAME}' ya existe en el volumen persistente. Omitiendo descarga."
              else
                echo "Descargando el modelo '${MODEL_NAME}' al volumen persistente..."
                ollama pull ${MODEL_NAME}
                echo "Modelo descargado y persistido con éxito."
              fi
              
              echo "Apagando servidor temporal..."
              kill $SERVER_PID
              wait $SERVER_PID 2>/dev/null || true
              exit 0
          env:
            - name: OLLAMA_MODEL
              value: "{{ .Values.ollamaModel | default "qwen2.5:0.5b" }}"
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-storage
      # =========================================================================
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 11434
              name: http
          envFrom:
            - configMapRef:
                name: ollama-config
            - secretRef:
                name: ollama-secrets
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
              {{- if .Values.resources.limits.gpu }}
              nvidia.com/gpu: {{ .Values.resources.limits.gpu | quote }}
              {{- end }}
          volumeMounts:
            - mountPath: /root/.ollama
              name: ollama-storage
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc