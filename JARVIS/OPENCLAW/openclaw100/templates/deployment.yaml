apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: jarvis-srv
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: openclaw-configurator
          image: ghcr.io/openclaw/openclaw:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "Inicializando configuración en /home/node/.openclaw..."
              mkdir -p /home/node/.openclaw
              openclaw onboard --mode local --non-interactive --accept-risk || true
              openclaw config set gateway.mode local || true
          volumeMounts:
            - name: openclaw-storage
              mountPath: /home/node/.openclaw
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: Always
          env:
            - name: OPENCLAW_GATEWAY_MODE
              value: "local"
            - name: OPENCLAW_GATEWAY_BIND
              value: "0.0.0.0"
            - name: OPENCLAW_NO_RESPAWN
              value: "1"
          envFrom:
            - configMapRef:
                name: openclaw-config
            - secretRef:
                name: openclaw-secrets
          ports:
            - containerPort: 18789
              name: gateway
          volumeMounts:
            - name: openclaw-storage
              mountPath: /home/node/.openclaw
          resources:
            limits:
              cpu: "500m"
              memory: "800Mi"
            requests:
              cpu: "250m"
              memory: "400Mi"
      volumes:
        - name: openclaw-storage
          persistentVolumeClaim:
            claimName: openclaw-pvc