apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: jarvis-srv
  labels:
    app: openclaw
spec:
  replicas: 1 # OpenClaw requiere una sola réplica por el estado de las conexiones websocket
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: openclaw-configurator
          image: ghcr.io/openclaw/openclaw:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "Configurando OpenClaw en modo local con aceptación de riesgo..."
              openclaw onboard --mode local --non-interactive --accept-risk || true
              openclaw config set gateway.mode local || true
          volumeMounts:
            - name: openclaw-storage
              mountPath: /root/.openclaw
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: Always
          args: ["gateway", "--allow-unconfigured", "--mode", "local"]
          ports:
            - containerPort: 18789
              name: gateway
          envFrom:
            - configMapRef:
                name: openclaw-config
            - secretRef:
                name: openclaw-secrets
          volumeMounts:
            - name: openclaw-storage
              mountPath: /root/.openclaw
          resources:
            limits:
              cpu: "500m"
              memory: "800Mi"
            requests:
              cpu: "250m"
              memory: "400Mi"
      volumes:
        - name: openclaw-storage
          persistentVolumeClaim:
            claimName: openclaw-pvc