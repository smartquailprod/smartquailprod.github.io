apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: jarvis-srv
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18789
              name: gateway
          envFrom:
            - configMapRef:
                name: openclaw-config
            - secretRef:
                name: openclaw-secrets
          volumeMounts:
            - name: openclaw-storage
              mountPath: /home/node/.openclaw
              # Opcional: Montar el openclaw.json del ConfigMap directamente si prefieres
          resources:
            limits:
              cpu: "500m"
              memory: "800Mi"
            requests:
              cpu: "250m"
              memory: "400Mi"
      volumes:
        - name: openclaw-storage
          persistentVolumeClaim:
            claimName: openclaw-pvc