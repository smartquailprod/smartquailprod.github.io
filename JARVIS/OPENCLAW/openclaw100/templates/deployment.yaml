apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: jarvis-srv
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: openclaw-bootstrap
          image: ghcr.io/openclaw/openclaw:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "Creando estructura de configuración para evitar bloqueos..."
              mkdir -p /home/node/.openclaw
              
              # Escribimos el openclaw.json con el modo local y el bind requeridos directamente,
              # evitando que el asistente interactivo o el doctor bloqueen el arranque.
              cat << 'EOF' > /home/node/.openclaw/openclaw.json
              {
                "gateway": {
                  "mode": "local",
                  "bind": "lan"
                }
              }
              EOF
              
              echo "Configuración base escrita correctamente."
          volumeMounts:
            - name: openclaw-storage
              mountPath: /home/node/.openclaw
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 18789
              name: gateway
          envFrom:
            - configMapRef:
                name: openclaw-config
            - secretRef:
                name: openclaw-secrets
          volumeMounts:
            - name: openclaw-storage
              mountPath: /home/node/.openclaw
          resources:
            limits:
              cpu: "500m"
              memory: "800Mi"
            requests:
              cpu: "250m"
              memory: "400Mi"
      volumes:
        - name: openclaw-storage
          persistentVolumeClaim:
            claimName: openclaw-pvc