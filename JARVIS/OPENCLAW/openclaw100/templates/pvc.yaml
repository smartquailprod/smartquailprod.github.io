  apiVersion: v1
  kind: PersistentVolume
  metadata:
    name: openclaw-pv-local
  spec:
    capacity:
      storage: 5Gi
    accessModes:
      - ReadWriteOnce
    persistentVolumeReclaimPolicy: Retain
    storageClassName: "local-storage"
    hostPath:
      path: /var/lib/openclaw
      type: DirectoryOrCreate