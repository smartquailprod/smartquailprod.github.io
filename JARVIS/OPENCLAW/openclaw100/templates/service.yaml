apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw.fullname" . }}
  namespace: jarvis-srv
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: gateway
      port: {{ .Values.service.port }}
      targetPort: gateway
      protocol: TCP
    - name: canvas
      port: {{ .Values.service.canvasPort }}
      targetPort: canvas
      protocol: TCP
  selector:
    {{- include "openclaw.selectorLabels" . | nindent 4 }}