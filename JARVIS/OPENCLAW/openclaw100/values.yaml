# OpenClaw Helm Chart Values
# https://docs.openclaw.ai/

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the release
fullnameOverride: ""

# Image configuration
image:
  # -- Container image repository
  repository: ghcr.io/openclaw/openclaw
  # -- Container image tag
  tag: "2026.10.6"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# OpenClaw application settings
openclaw:
  # -- Bind mode: "local" (requerido por el validador del esquema)
  bind: "local"
  # -- Timezone environment variable
  timezone: "UTC"
  # -- Config file mode: "merge" keeps existing config and merges helm values (helm wins conflicts),
  # "overwrite" replaces config entirely
  configMode: "merge"
  # -- Skills to install from ClawHub
  skills: []

  # Agent configuration (maps to agents.defaults in openclaw.json)
  agents:
    defaults:
      # -- Primary model routed to Ollama local endpoint
      model: "ollama/qwen2.5:0.5b"
      # -- Timeout in seconds for agent operations (Ampliado a 10 minutos para contextos grandes en CPU)
      timeoutSeconds: 600
      # -- Thinking mode: "low", "high", or "off"
      thinkingDefault: "low"

  # -- Raw JSON overrides compliant with schema (sin la llave 'options' no reconocida)
  configOverrides:
    gateway:
      mode: "local"
      controlUi:
        allowedOrigins:
          - "https://openclaw.smartquail.io"
          - "http://localhost:18789"
          - "http://127.0.0.1:18789"

# Credentials for LLM providers and channels
credentials:
  # -- Anthropic API key (no requerida al usar Ollama local)
  anthropicApiKey: ""
  # -- OpenAI API key / Ollama placeholder
  openaiApiKey: "ollama-local"
  # -- Gateway authentication token (auto-generated if empty)
  gatewayToken: ""
  # -- Extra secrets to configure Ollama base URL locally inside the cluster
  extraSecrets:
    OPENAI_BASE_URL: "http://ollama100-service.ai-models.svc.cluster.local:11434/v1"
  # -- Use an existing secret instead of creating one
  existingSecret: ""

# Chromium sidecar for browser automation (Desactivado para liberar RAM)
chromium:
  enabled: false
  image:
    repository: zenika/alpine-chrome
    tag: "124"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 500Mi
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# Persistence configuration (Usando disco local del Droplet mediante PVC/hostPath)
persistence:
  enabled: true
  size: 5Gi
  storageClass: "local-path"
  accessMode: ReadWriteOnce

# Service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Gateway port (WebSocket control plane)
  port: 18789
  # -- Canvas port (HTTP server)
  canvasPort: 18793
  # -- Annotations for the service
  annotations: {}

# Ingress configuration
ingress:
  # -- Enable ingress
  enabled: true
  # -- Ingress class name
  className: "nginx"
  # -- Annotations for the ingress con soporte WebSocket, cert-manager y Timeouts ampliados para IA en CPU
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cluster-issuer"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # -- Ingress hosts configuration
  hosts:
    - host: openclaw.smartquail.io
      paths:
        - path: /
          pathType: Prefix
          # -- Which service port to use (gateway or canvas)
          servicePort: gateway
  # -- TLS configuration
  tls:
    - secretName: openclaw-tls-secret
      hosts:
        - openclaw.smartquail.io

# Resource requests and limits for main OpenClaw container
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2.5Gi

# Security context for the pod
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Security context for the main OpenClaw container
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

# Service account configuration
serviceAccount:
  # -- Create a service account
  create: true
  # -- Service account name (auto-generated if empty)
  name: ""
  # -- Annotations for the service account
  annotations: {}

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# -- Annotations for the pod
podAnnotations: {}

# -- Labels for the pod
podLabels: {}

# -- Revision history limit for Deployment (number of old ReplicaSets to keep)
revisionHistoryLimit: 5

# -- Extra manifests to deploy alongside the chart.
extraManifests: []

# Probes configuration
probes:
  # Liveness probe
  liveness:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  # Readiness probe
  readiness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  # Startup probe (Ampliado para dar margen holgado en la CPU al arrancar)
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1